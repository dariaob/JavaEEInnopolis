spring.datasource.url=jdbc:postgresql://postgres05:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Server Configuration
server.ssl.enabled=false
server.servlet.context-path=/
server.port=9999

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.default_schema=clinic_db

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=clinic_db
spring.flyway.default-schema=clinic_db
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis config
spring.cache.type=redis
spring.data.redis.host=redis
spring.data.redis.port=6379

#Kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=appointments-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.session.timeout.ms=45000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.admin.auto-create=true

logging.level.org.apache.kafka=DEBUG
logging.level.org.springframework.kafka=DEBUG


# Logging
logging.level.root=INFO
logging.level.org.dariaob=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
